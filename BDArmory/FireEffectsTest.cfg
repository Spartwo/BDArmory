// ============================================================================================================================
// FIRE EFFECTS TEST PARTS (EFFECTS system / FireEffectController). Not for release: lives in REMOVE_FROM_RELEASE.
//
// Each test part is a copy of an existing part, so you can put the original and the copy side by side in the VAB and compare.
// Models are stand-ins from BDArmory/Models and are not meant to look right, only to be visible and distinguishable:
//     flash        BDArmory/Models/explosion/30mmExplosion        smoke      BDArmory/Models/explosion/flakSmoke, CMSmoke/cmSmokeModel
//     underwater   BDArmory/Models/CMBubble/cmSmokeModel          tube tests explosion / explosionLarge / flakSmoke
// All effects are attached to transforms that already exist in the original models (no model changes needed).
//
// LIFESPAN: `energy = <power> <multiplier>` scales the stand-in model's authored particle lifetime, by effect power (flat 1.0 = the model's own, which for
// explosion/smoke models is long). The values here shorten them (flash 0.15, smoke 0.15 -> 0.4 as power rises, bubbles 0.4). Tune per effect.
// LIGHTS: models can carry a baked Light (BDA's explosion models do). These flash with the FLASH effect only (never with smoke), and only if the
// LightFX setting is on. If a light seems stuck on, check it isn't in the part model itself (those are not touched).
//
// WHAT TO CHECK
//   1. bahaSidamTurretFXTest  4 barrels. Legacy baked flash is KEPT (fireEffectName is empty), smoke is new EFFECTS.
//        - Ripple fire: only the barrel that fires gets smoke (smokeEffectName is a LIST: entry i = barrel i).
//        - Underwater: the numbered bubble effects (fxTestBubbles1..4 = barrels 1..4) replace the legacy flash; smoke is suppressed.
//        - Altitude: smoke thins out with air density (power = density ratio^1) and is gone in near-vacuum. Flash is unaffected.
//   2. bahaTurretFXTest       .50 cal. Pure EFFECTS flash. NOTE: the model's baked muzzle emitters are not touched when fireEffectName is set, so
//                             if they idle-emit or flash on their own, that is the unconverted model, not the effect.
//        - fxTestFlash has a non-uniform localScale (0.5, 0.5, 2.0): it should look stretched along the barrel.
//        - Underwater: bubbles instead of the flash, smoke suppressed.
//   3. bahaSmokeCmPodFXTest   smoke launcher (CMDropper). Its legacy effect (the baked smoke on effectsTransform, still listed) is the PRIMARY effect and
//                             keeps firing exactly as bahaSmokeCmPod does; fxTestCMFlash is a SECONDARY flash fired in addition to it.
//      bahaSmokeCmPodFXTest2  same, but the legacy transforms are unlisted (effectsTransformName is emptied), so the baked smoke does NOT fire, and the
//                             smoke is an EFFECTS smoke instead (fxTestCMPuff, which thins with altitude) plus the same secondary flash.
//                             (If the baked smoke still fires on this one, the empty @effectsTransformName didn't take: check the loaded config.)
//   4. TestFASCAMMissileFXTest  MultiMissileLauncher (many tubes), effects at the launch rail root. Per-tube selection:
//        - the shared effect (fxTestVLS) fires on EVERY tube launched,
//        - plus the numbered effects fire for their own tube only: tube 1 = small explosion, tube 2 = large explosion, tube 3 = flak smoke.
//        - tubes 4+ get only the shared effect. If every tube shows the same thing, per-tube selection is broken.
//        - smoke (fxTestVLSSmoke) should fade with altitude like the guns'.
//   5. bahaAim9FXTest         AIM-9 missile (MissileLauncher: boost then cruise). EFFECTS plume instead of the legacy exhaustPrefabPath/baked plume.
//        - On launch: the boost plume (fxTestBoostPlume, large, on boostTransform), then at burnout of the boost the cruise plume (fxTestCruisePlume,
//          stretched along the exhaust with localScale 1, 1, 1.5, on exhaustTransform) takes over. The smoke trail (fxTestSmokeTrail) runs through both.
//        - Plume power follows the throttle. Nothing should be visible on the pad before launch (no startup puff).
//        - After burnout the cruise plume and trail fade out over plumeFadeTime (3 s here; the legacy plume lingers 5 s, then stops).
//        - When the missile detonates the world-space smoke trail is left behind to fade, as the legacy trail is.
//        - Altitude: the smoke trail thins out with air density (and is off in a vacuum). The flame doesn't.
//        - Compare with bahaAim9, which uses the legacy plume. RCS (if any) is unaffected.
//   Also watch the log for "[BDArmory.FireEffects]" / "[BDArmory.MissilePlume]" errors (missing effect names / transforms), and the one-line startup
//   summaries (how many emitters and lights each effect created).
//
// UNVERIFIED API CALLS (see FireEffectController): part.Effect(name, power) and part.Effect(name, power, transformIndex).
// ============================================================================================================================

// ---------------------------------------------------------------------------------------------------------- 4-barrel gun
+PART[bahaSidamTurret]:AFTER[BDArmory]
{
	@name = bahaSidamTurretFXTest
	@title = Sidam AA [FX TEST: legacy flash + EFFECTS smoke]

	@MODULE[ModuleWeapon]
	{
		// fireEffectName is NOT set: the baked muzzleTransform1..4 flash is still the (legacy) flash.
		smokeEffectName = fxTestSmokeA; fxTestSmokeB; fxTestSmokeC; fxTestSmokeD // list: entry i = barrel i
		underwaterFireEffectName = fxTestBubbles // numbered: fxTestBubbles1..4 = barrels 1..4
		suppressEffectsUnderwater = true // no underwater smoke effect: don't fire the normal smoke underwater
		smokeAtmosphereResponse = 1
	}

	EFFECTS
	{
		fxTestSmokeA
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = muzzleTransform1
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}

		fxTestSmokeB
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = muzzleTransform2
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}

		fxTestSmokeC
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = muzzleTransform3
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}

		fxTestSmokeD
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = muzzleTransform4
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}

		fxTestBubbles1
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMBubble/cmSmokeModel
				transformName = muzzleTransform1
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.4
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}

		fxTestBubbles2
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMBubble/cmSmokeModel
				transformName = muzzleTransform2
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.4
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}

		fxTestBubbles3
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMBubble/cmSmokeModel
				transformName = muzzleTransform3
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.4
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}

		fxTestBubbles4
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMBubble/cmSmokeModel
				transformName = muzzleTransform4
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.4
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}
	}
}

// ---------------------------------------------------------------------------------------------------------- single-barrel gun
+PART[bahaTurret]:AFTER[BDArmory]
{
	@name = bahaTurretFXTest
	@title = .50 Cal Turret [FX TEST: EFFECTS flash + smoke]

	@MODULE[ModuleWeapon]
	{
		fireEffectName = fxTestFlash // replaces the legacy baked muzzle flash (those emitters are left alone, not fired)
		smokeEffectName = fxTestGunSmoke
		underwaterFireEffectName = fxTestBubbles
		suppressEffectsUnderwater = true
		smokeAtmosphereResponse = 1
	}

	EFFECTS
	{
		fxTestFlash
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/30mmExplosion
				transformName = fireTransform
				emission = 0.0 0.0
				emission = 0.05 1.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.15
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 2.0 // xyz scale test: should be stretched along the barrel
			}
		}
		fxTestGunSmoke
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = fireTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}
		fxTestBubbles
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMBubble/cmSmokeModel
				transformName = fireTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.4
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}
	}
}

// ---------------------------------------------------------------------------------------------------------- smoke launcher
+PART[bahaSmokeCmPod]:AFTER[BDArmory]
{
	@name = bahaSmokeCmPodFXTest
	@title = Smoke CM Pod [FX TEST: legacy smoke + EFFECTS flash]

	@MODULE[CMDropper]
	{
		// effectsTransformName is untouched: the legacy smoke is the primary effect and keeps firing.
		fireEffectName = fxTestCMFlash // secondary flash, fired in addition to the legacy smoke
	}

	EFFECTS
	{
		fxTestCMFlash
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/30mmExplosion
				transformName = effectsTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.15
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}
	}
}

+PART[bahaSmokeCmPod]:AFTER[BDArmory]
{
	@name = bahaSmokeCmPodFXTest2
	@title = Smoke CM Pod [FX TEST: EFFECTS smoke + flash, legacy unlisted]

	@MODULE[CMDropper]
	{
		@effectsTransformName =
		smokeEffectName = fxTestCMPuff // EFFECTS smoke (fades with altitude)
		fireEffectName = fxTestCMFlash // the same secondary flash
		smokeAtmosphereResponse = 1
	}

	EFFECTS
	{
		fxTestCMPuff
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMSmoke/cmSmokeModel
				transformName = effectsTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.3
				energy = 1.0 0.5
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}

		fxTestCMFlash
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/30mmExplosion
				transformName = effectsTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.15
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5
			}
		}
	}
}

// ---------------------------------------------------------------------------------------------------------- multi-missile launcher
+PART[bahaVLSQuad]:AFTER[BDArmory]
{
	@name = TestFASCAMMissileFXTest
	@title = FASCAM [FX TEST: per-tube launch effects]

	@MODULE[MultiMissileLauncher]
	{
		fireEffectName = fxTestVLS // shared effect fxTestVLS (every tube) + numbered fxTestVLS1..3 (tubes 1..3 only)
		smokeEffectName = fxTestVLSSmoke
		smokeAtmosphereResponse = 1
	}

	EFFECTS
	{
		fxTestVLS
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/exhaust/smallExhaust
				transformName = launchers
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.3
				energy = 1.0 0.3
				localOffset = 0, 0, 0
				localScale = 1, 1, 1 // shared: fires on every tube
			}
		}

		fxTestVLS1
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/30mmExplosion
				transformName = missile1
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.2
				energy = 1.0 0.2
				localOffset = 0, 0, 0
				localScale = 1, 1, 1 // tube 1 only
			}
		}

		fxTestVLS2
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/explosionLarge
				transformName = missile1
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.2
				energy = 1.0 0.2
				localOffset = 0, 0, 0
				localScale = 0.5, 0.5, 0.5 // tube 2 only
			}
		}

		fxTestVLS3
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = missile1
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.3
				energy = 1.0 0.3
				localOffset = 0, 0, 0
				localScale = 1, 1, 1 // tube 3 only
			}
		}

		fxTestVLSSmoke
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/CMSmoke/cmSmokeModel
				transformName = launchers
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.15
				energy = 1.0 0.4
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}
	}
}

+PART[bahaVLSQuad]:AFTER[BDArmory]
{
	@name = TestCoverAnim
	@title = COVERANIM [ANIM TEST: per-tube animation]
	
	!mesh = DELETE
  	!MODEL {}
  	MODEL
  	{
    	model = BDArmoryExtended/Parts/VLSCell/AnimQuadVLS
  	}
	
	!MODULE[MultiMissileLauncher] {}

    MODULE
    {
        name = MultiMissileLauncher
        deployAnimationName = VLSDeploy
        deploySpeed = 0.75
        launchTransformName = launchers
        subMunitionName =
        subMunitionPath =
        salvoSize = 1
        setSalvoSize = true
        isMultiLauncher = true
        overrideReferenceTransform = true
        RailNode = rail
        tntMass = 25
        permitJettison = false
        OverrideDropSettings = true
        scaleTransformName = HatchMount
        lengthTransformName = Cells
        Length = 1.35
        ignoreLauncherColliders = true
        adjustMissileVOffset = false
    }
}


// ---------------------------------------------------------------------------------------------------------- missile plume
+PART[bahaAim9]:AFTER[BDArmory]
{
	@name = bahaAim9FXTest
	@title = AIM-9 [FX TEST: EFFECTS plume]

	@MODULE[MissileLauncher]
	{
		// Naming any plume effect replaces the legacy plume (exhaustPrefabPath, boostTransformName emitters). Those fields are left in place on purpose,
		// to check they're ignored.
		boostEffectName = fxTestBoostPlume // power follows the throttle while boosting
		plumeEffectName = fxTestCruisePlume // power follows the throttle while cruising, fades out after burnout
		smokeTrailEffectName = fxTestSmokeTrail // throttle * air density factor, through boost and cruise
		plumeFadeTime = 3
		smokeAtmosphereResponse = 1
	}

	EFFECTS
	{
		fxTestBoostPlume
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/exhaust/mediumExhaust
				transformName = boostTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.3
				energy = 1.0 0.5
				localOffset = 0, 0, 0
				localScale = 2, 2, 2 // large, so the boost is easy to tell from the cruise plume
			}
		}

		fxTestCruisePlume
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/exhaust/smallExhaust
				transformName = exhaustTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.3
				energy = 1.0 0.5
				localOffset = 0, 0, 0
				localScale = 1, 1, 1.5 // xyz scale test: stretched along the exhaust
			}
		}

		fxTestSmokeTrail
		{
			MODEL_MULTI_PARTICLE
			{
				modelName = BDArmory/Models/explosion/flakSmoke
				transformName = exhaustTransform
				emission = 0.0 0.0
				emission = 1.0 1.0
				speed = 0.0 1.0
				speed = 1.0 1.0
				energy = 0.0 0.3
				energy = 1.0 0.6
				localOffset = 0, 0, 0
				localScale = 1, 1, 1
			}
		}
	}
}
